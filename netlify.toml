# Netlify configuration for the NLC Digital Performance Dashboard.
# The dashboard is a Next.js app living in the dashboard/ subfolder of this
# repo, so we point Netlify's build at that base directory. The rest of the
# repo (the static marketing site) is untouched by this config.
[build]
  base = "dashboard"
  command = "npm run build"

# Official Next.js runtime — handles SSR routes (e.g. /api/gbp), the App
# Router, image optimization and caching automatically.
[[plugins]]
  package = "@netlify/plugin-nextjs"
