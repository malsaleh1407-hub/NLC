name: Deploy dashboard to GitHub Pages

# Builds the Next.js dashboard as a static site and publishes it to GitHub
# Pages. Runs on GitHub's servers (which can reach Pages), so it works even
# though the dev container's network is restricted.

on:
  push:
    branches:
      - claude/nlc-performance-dashboard-3ky0xb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      STATIC_EXPORT: "true"
      # GitHub Pages serves project sites under /<repo-name>.
      PAGES_BASE_PATH: /NLC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The /api/gbp route is a server feature, not needed for the static build.
      - name: Remove server-only API routes for static export
        run: rm -rf app/api

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
