name: Site audit

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails the build when broken internal references exceed .audit-baseline.
      # Ratchet the baseline down as the site heals; never raise it silently.
      - name: Run audit against baseline
        run: python3 site_audit.py --max-broken "$(cat .audit-baseline)" | tee audit-summary.txt

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## NLC site audit"
            echo '```'
            cat audit-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep the committed dashboard-data.js in sync with every push, so
      # dashboard.html always shows the latest audit after a git pull.
      # Timestamp-only changes are ignored; [skip ci] prevents a re-trigger.
      - name: Commit refreshed dashboard data
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY' && changed=1 || changed=0
          import re, subprocess, sys
          def norm(text):
              return re.sub(r'\d{4}-\d{2}-\d{2} \d{2}:\d{2} UTC', '', text)
          new = norm(open('dashboard-data.js').read())
          old = subprocess.run(['git', 'show', 'HEAD:dashboard-data.js'],
                               capture_output=True, text=True).stdout
          sys.exit(0 if norm(old) != new else 1)
          PY
          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard-data.js
            git commit -m "Refresh dashboard-data.js after audit [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "Dashboard data unchanged; nothing to commit."
          fi
