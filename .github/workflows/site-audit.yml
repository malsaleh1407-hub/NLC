name: Site audit

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'   # daily, 06:17 Riyadh time
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-audit-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # adds -o pipefail, so a failing audit is not masked by tee

env:
  # Override with a repository variable named LIVE_SITE_URL if the domain changes.
  LIVE_SITE_URL: ${{ vars.LIVE_SITE_URL || 'https://nlc.com.sa' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails the build when broken internal references exceed .audit-baseline.
      # Ratchet the baseline down as the site heals; never raise it silently.
      - name: Audit repository against baseline
        run: python3 site_audit.py --max-broken "$(cat .audit-baseline)" | tee audit-summary.txt

      # Report-only: a slow or unreachable live site must not block pushes.
      # The committed live data is replaced only when the crawl loaded pages.
      - name: Audit live site
        id: live
        if: >-
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref_name == 'main')
        continue-on-error: true
        run: |
          python3 site_audit.py --url "$LIVE_SITE_URL" --out /tmp/live-data.js | tee live-summary.txt
          mv /tmp/live-data.js dashboard-live-data.js

      # Traffic numbers are business data. In a public repository they would be
      # readable by anyone (data file, Pages site and these logs), so this step
      # runs only when the repository is private or PUBLISH_ANALYTICS is 'true'.
      - name: Fetch Google Analytics and Search Console
        if: >-
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref_name == 'main')
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          PUBLISH_ANALYTICS: ${{ vars.PUBLISH_ANALYTICS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Google is not connected yet. See ANALYTICS-SETUP.md."
            exit 0
          fi
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$private" != "true" ] && [ "$PUBLISH_ANALYTICS" != "true" ]; then
            echo "::warning::Skipped: this repository is public, so traffic data would be public. Make the repository private, or set the repository variable PUBLISH_ANALYTICS to true to accept that."
            exit 0
          fi
          pip install --quiet --disable-pip-version-check google-auth requests
          python3 analytics_fetch.py /tmp/analytics-data.js | tee analytics-summary.txt
          mv /tmp/analytics-data.js dashboard-analytics-data.js

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## NLC site audit"
            echo "### Repository"
            echo '```'
            cat audit-summary.txt 2>/dev/null
            echo '```'
            if [ -f analytics-summary.txt ]; then
              echo "### Google Analytics and Search Console"
              echo '```'
              cat analytics-summary.txt
              echo '```'
            fi
            if [ -f live-summary.txt ]; then
              echo "### Live site ($LIVE_SITE_URL)"
              echo '```'
              cat live-summary.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Commit refreshed dashboard data so dashboard.html always shows the
      # latest audit. Timestamp-only changes are ignored; [skip ci] keeps the
      # bot commit from re-triggering this workflow.
      - name: Commit refreshed dashboard data
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          changed=$(python3 - <<'PY'
          import os, re, subprocess
          def norm(text):
              return re.sub(r'\d{4}-\d{2}-\d{2} \d{2}:\d{2} UTC', '', text)
          out = []
          for path in ('dashboard-data.js', 'dashboard-live-data.js', 'dashboard-analytics-data.js'):
              if not os.path.exists(path):
                  continue
              old = subprocess.run(['git', 'show', 'HEAD:' + path],
                                   capture_output=True, text=True).stdout
              if norm(old) != norm(open(path, encoding='utf-8').read()):
                  out.append(path)
          print(' '.join(out))
          PY
          )
          if [ -z "$changed" ]; then
            echo "Dashboard data unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $changed
          git commit -m "Refresh dashboard data after audit [skip ci]"
          git checkout -- .   # drop timestamp-only edits left uncommitted, or the rebase refuses
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # Commits made with GITHUB_TOKEN do not always trigger a Pages rebuild,
      # so request one explicitly. Only relevant on the branch Pages serves.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == '1' && github.ref_name == 'main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
